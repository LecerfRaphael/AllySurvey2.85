yaml
name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push vers GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.univ-lille.fr/raphael.lecerf/allysurvey.git"
          git push gitlab --force 'refs/remotes/origin/*:refs/heads/*'
          git push gitlab --force --tags
